apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-warm
provisioner: cluster.local/nfs-subdir-external-provisioner
parameters:
  archiveOnDelete: "true"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.2
  - hard
  - timeo=600
  - retrans=2
  - noatime
