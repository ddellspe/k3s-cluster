apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-remediator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-remediator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-remediator
subjects:
  - kind: ServiceAccount
    name: pod-remediator
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: pod-remediator
  apiGroup: rbac.authorization.k8s.io
