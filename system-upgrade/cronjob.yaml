apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-plan-auto-updater
  namespace: system-upgrade
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: updater
            image: alpine/k8s:1.37.1
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              set -e

              # 1. Determine target release for current minor version (patch updates only)
              CURRENT_MINOR=$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.kubeletVersion}' | grep -oE 'v1\.[0-9]+')
              echo "Current cluster minor version: $CURRENT_MINOR"

              CHANNELS_JSON=$(curl -sL https://update.k3s.io/v1-release/channels)
              LATEST_TAG=$(echo "$CHANNELS_JSON" | jq -r --arg m "$CURRENT_MINOR" '.data[] | select(.id == $m) | .latest')

              if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
                echo "Warning: Channel $CURRENT_MINOR not found, checking stable channel..."
                LATEST_TAG=$(echo "$CHANNELS_JSON" | jq -r '.data[] | select(.id == "stable") | .latest')
              fi

              if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
                echo "Error: Unable to determine target release tag"
                exit 1
              fi

              echo "Target release tag: $LATEST_TAG"

              # 2. Pre-upgrade safeguard: ensure HelmCharts allow taking ownership & remove conflicting admission policies
              echo "Applying pre-upgrade safeguards..."
              kubectl patch helmchart traefik-crd -n kube-system --type=merge -p '{"spec":{"takeOwnership":true}}' 2>/dev/null || true
              kubectl delete validatingadmissionpolicy,validatingadmissionpolicybinding safe-upgrades.gateway.networking.k8s.io 2>/dev/null || true

              # 3. Detect any outdated nodes and clear stale completion labels if needed
              UPDATED=false
              OUTDATED_NODES=$(kubectl get nodes -o json | jq -r --arg tag "$LATEST_TAG" '.items[] | select(.status.nodeInfo.kubeletVersion != $tag) | .metadata.name')
              if [ -n "$OUTDATED_NODES" ]; then
                echo "Detected outdated node(s): $(echo $OUTDATED_NODES | tr '\n' ' ')"
                for NODE in $OUTDATED_NODES; do
                  LABELS=$(kubectl get node "$NODE" -o jsonpath='{.metadata.labels}' 2>/dev/null || echo "")
                  if echo "$LABELS" | grep -q 'plan.upgrade.cattle.io'; then
                    echo "Node $NODE has stale plan completion label but is not on $LATEST_TAG. Stripping label to force re-upgrade..."
                    kubectl label node "$NODE" plan.upgrade.cattle.io/k3s-server- plan.upgrade.cattle.io/k3s-agent- 2>/dev/null || true
                  fi
                done
                UPDATED=true
              fi

              # 4. Check and patch upgrade plans
              for PLAN in k3s-server k3s-agent; do
                CURRENT_VERSION=$(kubectl get plan $PLAN -n system-upgrade -o jsonpath='{.spec.version}' 2>/dev/null || echo "")
                echo "Current $PLAN version: $CURRENT_VERSION"

                # If plan failed previously, clear the failed condition so SUC can retry
                FAILED=$(kubectl get plan $PLAN -n system-upgrade -o jsonpath='{.status.conditions[?(@.reason=="JobFailed")].reason}' 2>/dev/null || echo "")
                if [ -n "$FAILED" ]; then
                  echo "Clearing previous failed status condition on $PLAN plan..."
                  kubectl patch plan $PLAN -n system-upgrade --subresource=status --type=merge -p '{"status":{"applying":null,"conditions":[]}}' || true
                  UPDATED=true
                fi

                if [ "$LATEST_TAG" != "$CURRENT_VERSION" ]; then
                  echo "Patching $PLAN Plan to version $LATEST_TAG..."
                  kubectl patch plan $PLAN -n system-upgrade --type=merge -p "{\"spec\":{\"version\":\"$LATEST_TAG\"}}"
                  echo "$PLAN Plan updated successfully!"
                  UPDATED=true
                else
                  echo "$PLAN Plan is already up to date ($CURRENT_VERSION)."
                fi
              done

              # 5. If an upgrade was triggered or nodes are outdated, wait and verify cluster convergence
              if [ "$UPDATED" = "true" ] || [ -n "$OUTDATED_NODES" ]; then
                echo "Waiting up to 15 minutes for all nodes to upgrade to $LATEST_TAG..."
                ALL_READY=false
                for i in $(seq 1 30); do
                  sleep 30
                  PENDING=$(kubectl get nodes -o json | jq -r --arg tag "$LATEST_TAG" '.items[] | select(.status.nodeInfo.kubeletVersion != $tag) | .metadata.name')
                  if [ -z "$PENDING" ]; then
                    echo "All nodes successfully upgraded to $LATEST_TAG!"
                    ALL_READY=true
                    break
                  fi
                  PENDING_COUNT=$(echo "$PENDING" | wc -w)
                  echo "[$i/30] $PENDING_COUNT node(s) still upgrading: $(echo $PENDING | tr '\n' ' ')"
                done

                if [ "$ALL_READY" != "true" ]; then
                  echo "ERROR: Nodes failed to converge to $LATEST_TAG within 15 minutes:"
                  kubectl get nodes -o wide
                  exit 1
                fi

                # 6. Post-upgrade check for failing pods in kube-system
                echo "Checking for unhealthy pods in kube-system..."
                UNHEALTHY=$(kubectl get pods -n kube-system --field-selector status.phase!=Running,status.phase!=Succeeded --no-headers | wc -l || true)
                if [ "$UNHEALTHY" -gt 0 ]; then
                  echo "WARNING: Found $UNHEALTHY unhealthy pod(s) in kube-system:"
                  kubectl get pods -n kube-system --field-selector status.phase!=Running,status.phase!=Succeeded
                else
                  echo "kube-system is healthy. Upgrade completed successfully!"
                fi
              fi
          restartPolicy: OnFailure
          serviceAccountName: system-upgrade
  schedule: "0 2 * * 0"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  suspend: false
