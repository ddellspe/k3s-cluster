apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: monitoring
  labels:
    app: server
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: caretta
    helm.sh/chart: victoria-metrics-single-0.8.48
    app.kubernetes.io/managed-by: Helm
  name: caretta-vm
spec:
  serviceName: caretta-vm
  selector:
    matchLabels:
      app: server
      app.kubernetes.io/name: victoria-metrics-single
      app.kubernetes.io/instance: caretta
  replicas: 1
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels:
        app: server
        app.kubernetes.io/name: victoria-metrics-single
        app.kubernetes.io/instance: caretta
        helm.sh/chart: victoria-metrics-single-0.8.48
        app.kubernetes.io/managed-by: Helm
    spec:
      automountServiceAccountToken: true
      containers:
      - name: victoria-metrics-single-server
        image: quay.io/groundcover/victoria-metrics:v1.85.3
        imagePullPolicy: IfNotPresent
        args:
        - --retentionPeriod=1
        - --storageDataPath=/storage
        - -promscrape.config=/scrapeconfig/scrape.yml
        - --envflag.enable=true
        - --envflag.prefix=VM_
        - --loggerFormat=json
        ports:
        - name: http
          containerPort: 8428
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 8428
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 350Mi
          requests:
            cpu: 5m
            memory: 50Mi
        volumeMounts:
        - name: server-volume
          mountPath: /storage
          subPath: null
        - name: scrapeconfig
          mountPath: /scrapeconfig
      serviceAccountName: caretta-victoria-metrics-single
      terminationGracePeriodSeconds: 60
      volumes:
      - name: scrapeconfig
        configMap:
          name: caretta-vm-scrapeconfig
      - name: server-volume
        emptyDir: {}
