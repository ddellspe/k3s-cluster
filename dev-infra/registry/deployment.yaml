apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: dev-infra
  labels:
    app: zot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      nodeSelector:
        kubernetes.io/hostname: distiller
      containers:
      - name: zot
        image: ghcr.io/project-zot/zot:v2.1.21
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
        - name: config-volume
          mountPath: /etc/zot/config.json
          subPath: config.json
        livenessProbe:
          httpGet:
            path: /livez
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zot-pvc
      - name: config-volume
        configMap:
          name: zot-config
