apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-controller-gha-rs-controller
  namespace: dev-infra
  labels:
    app.kubernetes.io/name: gha-rs-controller
    app.kubernetes.io/instance: arc-controller
    app.kubernetes.io/part-of: gha-rs-controller
    actions.github.com/controller-service-account-namespace: dev-infra
    actions.github.com/controller-service-account-name: arc-controller-gha-rs-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
      app.kubernetes.io/namespace: dev-infra
      app.kubernetes.io/instance: arc-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: "manager"
      labels:
        app.kubernetes.io/part-of: gha-rs-controller
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/name: gha-rs-controller
        app.kubernetes.io/namespace: dev-infra
        app.kubernetes.io/instance: arc-controller
    spec:
      serviceAccountName: arc-controller-gha-rs-controller
      nodeSelector:
        kubernetes.io/hostname: distiller
      containers:
      - name: manager
        image: "ghcr.io/actions/gha-runner-scale-set-controller:0.14.2"
        imagePullPolicy: IfNotPresent
        args:
        - "--auto-scaling-runner-set-only"
        - "--log-level=debug"
        - "--log-format=text"
        - "--runner-max-concurrent-reconciles=2"
        - "--update-strategy=immediate"
        - "--listener-metrics-addr=0"
        - "--listener-metrics-endpoint="
        - "--metrics-addr=0"
        command:
        - "/manager"
        env:
        - name: CONTROLLER_MANAGER_CONTAINER_IMAGE
          value: "ghcr.io/actions/gha-runner-scale-set-controller:0.14.2"
        - name: CONTROLLER_MANAGER_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      terminationGracePeriodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
