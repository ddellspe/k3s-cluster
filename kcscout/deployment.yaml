apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcscout
  namespace: kcscout
  labels:
    app: kcscout
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 5m"
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: kcscout
  template:
    metadata:
      labels:
        app: kcscout
    spec:
      containers:
        - name: kcscout
          image: registry.ddellspe.dev/kcscout:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATA_DIR
              value: "/app/data"
            - name: PUBLIC_BASE_URL
              value: "https://kcscout.ddellspe.dev"
            - name: PRESET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kcscout-secret
                  key: PRESET_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kcscout-data-pvc-warm

