apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-flux
  namespace: llm
  labels:
    app: llm-flux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-flux
  template:
    metadata:
      labels:
        app: llm-flux
    spec:
      nodeSelector:
        gpu.family: strix-halo
      containers:
      - name: vllm-flux
        image: docker.io/vllm/vllm-omni-rocm:v0.28.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          echo "Starting FLUX.1-schnell vLLM-Omni server on port 8000..."
          exec vllm serve black-forest-labs/FLUX.1-schnell \
            --omni \
            --port 8000 \
            --trust-remote-code \
            --enforce-eager
        env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.5.1"
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: VLLM_TARGET_DEVICE
          value: "rocm"
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: TRANSFORMERS_CACHE
          value: "/root/.cache/huggingface"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        ports:
        - containerPort: 8000
          name: http
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /dev/kfd
          name: dev-kfd
        - mountPath: /dev/dri
          name: dev-dri
        - mountPath: /root/.cache/huggingface
          name: hf-cache
        resources:
          requests:
            cpu: "4"
            memory: "25Gi"
          limits:
            cpu: "16"
            memory: "35Gi"
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: hf-cache
        hostPath:
          path: /var/lib/rancher/k3s/storage/hf-cache
          type: DirectoryOrCreate
