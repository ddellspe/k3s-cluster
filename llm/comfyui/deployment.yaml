apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: llm
  labels:
    app: comfyui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      nodeSelector:
        gpu.family: strix-halo
      containers:
      - name: comfyui
        image: docker.io/yanwk/comfyui-boot:rocm7
        imagePullPolicy: IfNotPresent
        env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.5.1"
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: PYTORCH_HIP_ALLOC_CONF
          value: "expandable_segments:True"
        - name: PYTORCH_ALLOC_CONF
          value: "expandable_segments:True"
        - name: HSA_ENABLE_SDMA
          value: "0"
        - name: HSA_USE_SVM
          value: "0"
        - name: CLI_ARGS
          value: "--listen 0.0.0.0 --port 8188 --use-pytorch-cross-attention --disable-mmap --disable-smart-memory"
        ports:
        - containerPort: 8188
          name: http
        startupProbe:
          httpGet:
            path: /
            port: 8188
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8188
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8188
          periodSeconds: 15
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /dev/kfd
          name: dev-kfd
        - mountPath: /dev/dri
          name: dev-dri
        - mountPath: /root
          name: comfy-storage
        - mountPath: /root/.cache/huggingface
          name: hf-cache
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
          limits:
            cpu: "16"
            memory: "48Gi"
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: comfy-storage
        hostPath:
          path: /var/lib/rancher/k3s/storage/comfyui
          type: DirectoryOrCreate
      - name: hf-cache
        hostPath:
          path: /var/lib/rancher/k3s/storage/hf-cache
          type: DirectoryOrCreate
