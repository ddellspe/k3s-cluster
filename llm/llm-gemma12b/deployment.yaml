apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gemma12b
  namespace: llm
  labels:
    app: llm-gemma12b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-gemma12b
  template:
    metadata:
      labels:
        app: llm-gemma12b
    spec:
      nodeSelector:
        gpu.family: strix-halo
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server-rocm
        imagePullPolicy: IfNotPresent
        command:
        - /app/llama-server
        args:
        - --hf-repo
        - unsloth/gemma-4-12b-it-GGUF
        - --hf-file
        - gemma-4-12b-it-Q4_0.gguf
        - -c
        - "65536"
        - -ngl
        - "99"
        - -fa
        - "off"
        - -np
        - "2"
        - --n-predict
        - "4096"
        - --jinja
        - --logit-bias
        - 62-inf
        - --reasoning-budget
        - "8192"
        - --timeout
        - "120"
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --alias
        - google/gemma-4-12b-it
        - --metrics
        env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.5.1"
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        - name: LLAMA_CACHE
          value: "/root/.cache/llama.cpp"
        ports:
        - containerPort: 8000
          name: http
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /dev/kfd
          name: dev-kfd
        - mountPath: /dev/dri
          name: dev-dri
        - mountPath: /root/.cache/llama.cpp
          name: hf-cache
        - mountPath: /root/.cache/huggingface
          name: hf-cache
        resources:
          requests:
            cpu: "2"
            memory: "12Gi"
          limits:
            cpu: "8"
            memory: "20Gi"
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: hf-cache
        hostPath:
          path: /var/lib/rancher/k3s/storage/hf-cache
          type: DirectoryOrCreate
