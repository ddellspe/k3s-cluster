apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-whisper
  namespace: llm
  labels:
    app: llm-whisper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-whisper
  template:
    metadata:
      labels:
        app: llm-whisper
    spec:
      nodeSelector:
        kubernetes.io/hostname: "well"
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: preload-model
        image: ghcr.io/speaches-ai/speaches:latest-cpu
        command:
        - python3
        - -c
        - |
          import huggingface_hub
          print("Checking and ensuring Systran/faster-whisper-small in cache...")
          huggingface_hub.snapshot_download(
              "Systran/faster-whisper-small",
              allow_patterns=["config.json", "preprocessor_config.json", "model.bin", "tokenizer.json", "vocabulary.*", "README.md"]
          )
          print("Model ready!")
        volumeMounts:
        - mountPath: /home/ubuntu/.cache/huggingface
          name: model-cache
      containers:
      - name: speaches
        image: ghcr.io/speaches-ai/speaches:latest-cpu
        imagePullPolicy: IfNotPresent
        env:
        - name: WHISPER__MODEL
          value: "Systran/faster-whisper-small"
        - name: WHISPER__INFERENCE_DEVICE
          value: "cpu"
        - name: WHISPER__COMPUTE_TYPE
          value: "int8"
        - name: WHISPER__CPU_THREADS
          value: "4"
        - name: WHISPER__TTL
          value: "-1"
        ports:
        - containerPort: 8000
          name: http
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "3000m"
            memory: "2Gi"
        volumeMounts:
        - mountPath: /home/ubuntu/.cache/huggingface
          name: model-cache
        - mountPath: /home/ubuntu/speaches/model_aliases.json
          name: model-aliases
          subPath: model_aliases.json
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-whisper-pvc
      - name: model-aliases
        configMap:
          name: llm-whisper-aliases
