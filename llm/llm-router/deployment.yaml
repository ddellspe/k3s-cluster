apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: llm
  labels:
    app: llm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
    spec:
      nodeSelector:
        kubernetes.io/hostname: well
      containers:
      - name: litellm-router
        image: ghcr.io/berriai/litellm:main-latest
        imagePullPolicy: Always
        args:
        - --config
        - /app/config.yaml
        - --host
        - "0.0.0.0"
        - --port
        - "4000"
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: llm-router-key
              key: master-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-db-secret
              key: database-url
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LITELLM_LOCAL_MODEL_COST_MAP
          value: "True"
        - name: MALLOC_TRIM_THRESHOLD_
          value: "100000"
        - name: SMTP_HOST
          value: "mail.ddellspe.net"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USERNAME
          value: "llm@ddellspe.net"
        - name: SMTP_SENDER_EMAIL
          value: "llm@ddellspe.net"
        - name: SMTP_TLS
          value: "True"
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: llm-smtp-secret
              key: smtp-password
        - name: TEST_EMAIL_ADDRESS
          value: "david@ddellspe.net"


        ports:
        - containerPort: 4000
          name: http
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 4000
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 8
        volumeMounts:
        - mountPath: /app/config.yaml
          name: config-volume
          subPath: config.yaml
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
      volumes:
      - name: config-volume
        configMap:
          name: llm-router-config
