apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app: open-webui
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: well
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:v0.11.4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          python3 /app/backend/patches/patch_images.py || true
          exec /app/backend/start.sh
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: OPENAI_API_BASE_URLS
          value: "http://llm-router-service.llm:4000/v1"
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: llm-router-key
              key: master-key
        - name: ENABLE_OLLAMA_API
          value: "False"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: WEBUI_NAME
          value: "ddellspe LLM Gateway"
        - name: DEFAULT_INTERFACE_SETTINGS
          value: '{"richTextInput": false}'
        - name: FILE_IMAGE_COMPRESSION_WIDTH
          value: "768"
        - name: FILE_IMAGE_COMPRESSION_HEIGHT
          value: "768"
        - name: IMAGE_EDIT_MAX_DIM
          value: "768"
        - name: ENABLE_OPENAI_IMAGE_EDIT_NORMALIZATION
          value: "True"
        - name: ENABLE_RAG_WEB_SEARCH
          value: "True"
        - name: RAG_WEB_SEARCH_ENGINE
          value: "searxng"
        - name: SEARXNG_QUERY_URL
          value: "http://searxng-service.llm:8080/search?q=<query>"
        - name: WEB_LOADER_ENGINE
          value: "playwright"
        - name: PLAYWRIGHT_WS_URL
          value: "ws://playwright-service.llm:3000"
        - name: PLAYWRIGHT_TIMEOUT
          value: "15000"
        - name: ENABLE_IMAGE_GENERATION
          value: "True"
        - name: IMAGE_GENERATION_ENGINE
          value: "openai"
        - name: IMAGE_GENERATION_MODEL
          value: "black-forest-labs/FLUX.2-klein-9B"
        - name: IMAGE_SIZE
          value: "768x768"
        - name: IMAGE_STEPS
          value: "4"
        - name: IMAGES_OPENAI_API_BASE_URL
          value: "http://llm-router-service.llm:4000/v1"
        - name: IMAGES_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-router-key
              key: master-key
        - name: ENABLE_IMAGE_EDIT
          value: "True"
        - name: IMAGE_EDIT_ENGINE
          value: "openai"
        - name: IMAGE_EDIT_MODEL
          value: "black-forest-labs/FLUX.2-klein-9B"
        - name: IMAGE_EDIT_SIZE
          value: ""
        - name: IMAGES_EDIT_OPENAI_API_BASE_URL
          value: "http://llm-router-service.llm:4000/v1"
        - name: IMAGES_EDIT_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-router-key
              key: master-key
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - mountPath: /app/backend/data
          name: webui-data
        - mountPath: /app/backend/patches
          name: webui-patch
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-pvc-hot
      - name: webui-patch
        configMap:
          name: open-webui-patch

