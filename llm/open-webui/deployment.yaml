apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
  labels:
    app: open-webui
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: rocks
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: OPENAI_API_BASE_URLS
          value: "http://llm-router-service.llm:4000/v1"
        - name: OPENAI_API_KEYS
          value: "none"
        - name: ENABLE_OLLAMA_API
          value: "False"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: WEBUI_NAME
          value: "ddellspe LLM Gateway"
        - name: DEFAULT_INTERFACE_SETTINGS
          value: '{"richTextInput": false}'
        - name: ENABLE_RAG_WEB_SEARCH
          value: "True"
        - name: RAG_WEB_SEARCH_ENGINE
          value: "searxng"
        - name: SEARXNG_QUERY_URL
          value: "http://searxng-service.llm:8080/search?q=<query>"
        - name: WEB_LOADER_ENGINE
          value: "playwright"
        - name: PLAYWRIGHT_WS_URL
          value: "ws://playwright-service.llm:3000"
        - name: PLAYWRIGHT_TIMEOUT
          value: "15000"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - mountPath: /app/backend/data
          name: webui-data
      volumes:
      - name: webui-data
        hostPath:
          path: /var/lib/rancher/k3s/storage/open-webui-data
          type: DirectoryOrCreate
