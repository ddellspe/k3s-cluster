apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-patch
  namespace: llm
data:
  patch_images.py: |
    import re
    import sys
    import os

    TARGET = "/app/backend/open_webui/routers/images.py"

    if not os.path.exists(TARGET):
        print(f"Target file {TARGET} does not exist, skipping patch.")
        sys.exit(0)

    with open(TARGET, "r") as f:
        content = f.read()

    # 1. Replace normalize_openai_edit_image_data_url with aspect-ratio downscaler & multiple-of-16 alignment
    NEW_FUNC_BODY = '''def normalize_openai_edit_image_data_url(data_url: str) -> str:
        if not data_url.startswith("data:") or "," not in data_url:
            return data_url

        header, encoded = data_url.split(",", 1)
        try:
            import os
            max_dim = int(os.getenv("IMAGE_EDIT_MAX_DIM", os.getenv("FILE_IMAGE_COMPRESSION_WIDTH", "768")))
            image_bytes = base64.b64decode(encoded)
            with Image.open(io.BytesIO(image_bytes)) as image:
                image = ImageOps.exif_transpose(image)
                if image.mode in ("RGBA", "LA"):
                    bg = Image.new("RGB", image.size, (255, 255, 255))
                    bg.paste(image, mask=image.split()[-1])
                    image = bg
                elif image.mode != "RGB":
                    image = image.convert("RGB")

                w, h = image.size
                scale = min(1.0, max_dim / max(w, h))
                new_w = int(w * scale)
                new_h = int(h * scale)

                # Snap dimensions to multiples of 16 (required for diffusion VAEs like FLUX)
                new_w = max(16, (new_w // 16) * 16)
                new_h = max(16, (new_h // 16) * 16)

                if (new_w, new_h) != (w, h):
                    log.info(f"Downscaling edit image from {w}x{h} to {new_w}x{new_h} (max_dim={max_dim})")
                    image = image.resize((new_w, new_h), Image.Resampling.LANCZOS)

                output = io.BytesIO()
                image.save(output, format="PNG")
                normalized_image = base64.b64encode(output.getvalue()).decode("utf-8")
                return f"data:image/png;base64,{normalized_image}"
        except Exception as e:
            log.warning(f"Image edit normalization error: {e}")
            return data_url
    '''

    pattern = r'def normalize_openai_edit_image_data_url\(data_url: str\) -> str:.*?(?=\ndef get_image_file_item)'
    if re.search(pattern, content, re.DOTALL):
        content = re.sub(pattern, NEW_FUNC_BODY.strip() + "\n\n", content, flags=re.DOTALL)
        print("Successfully patched normalize_openai_edit_image_data_url")
    else:
        print("normalize_openai_edit_image_data_url already patched or pattern changed")

    # 2. In image_edits, forward num_inference_steps, IMAGES_OPENAI_API_PARAMS, and preserve aspect ratio size
    TARGET_DATA = "else {'response_format': 'b64_json'}\n                ),\n            }"
    REPLACEMENT_DATA = "else {'response_format': 'b64_json'}\n                ),\n                'num_inference_steps': getattr(image_config, 'IMAGE_STEPS', 4) or 4,\n                **({} if not getattr(image_config, 'IMAGES_OPENAI_API_PARAMS', None) else image_config.IMAGES_OPENAI_API_PARAMS),\n            }"

    if TARGET_DATA in content:
        content = content.replace(TARGET_DATA, REPLACEMENT_DATA, 1)
        print("Successfully patched image_edits to forward num_inference_steps & IMAGES_OPENAI_API_PARAMS")
    else:
        print("image_edits data block already patched or pattern changed")

    # 3. In image_edits, if user did not explicitly supply form_data.size, infer exact dimensions from normalized image
    TARGET_SIZE_INFER = "url_search_params = ''\n            if image_config.IMAGES_EDIT_OPENAI_API_VERSION:"
    REPLACEMENT_SIZE_INFER = (
        "if not form_data.size and files:\n"
        "                try:\n"
        "                    f_io = files[0][1][1]\n"
        "                    f_pos = f_io.tell()\n"
        "                    with Image.open(f_io) as _pimg:\n"
        "                        data['size'] = f\"{_pimg.width}x{_pimg.height}\"\n"
        "                    f_io.seek(f_pos)\n"
        "                    log.info(f\"Preserving image edit aspect ratio with size: {data['size']}\")\n"
        "                except Exception as _e:\n"
        "                    log.warning(f\"Failed to infer size from edit image: {_e}\")\n\n"
        "            url_search_params = ''\n"
        "            if image_config.IMAGES_EDIT_OPENAI_API_VERSION:"
    )

    if TARGET_SIZE_INFER in content:
        content = content.replace(TARGET_SIZE_INFER, REPLACEMENT_SIZE_INFER, 1)
        print("Successfully patched image_edits to infer size from normalized image")
    else:
        print("image_edits size inference block already patched or pattern changed")

    with open(TARGET, "w") as f:
        f.write(content)
    print("Patch application completed successfully.")

    # 4. Patch audio.py get_available_voices to fetch voices from Kokoro when routed through LiteLLM
    AUDIO_TARGET = "/app/backend/open_webui/routers/audio.py"
    if os.path.exists(AUDIO_TARGET):
        try:
            with open(AUDIO_TARGET, "r") as f:
                audio_content = f.read()

            OLD_VOICES_CALL = "f'{base_url}/audio/voices'"
            NEW_VOICES_CALL = "('http://llm-kokoro-service.llm:8880/v1/audio/voices' if ('llm-router' in base_url or '4000' in base_url) else f'{base_url}/audio/voices')"
            if OLD_VOICES_CALL in audio_content:
                audio_content = audio_content.replace(OLD_VOICES_CALL, NEW_VOICES_CALL, 1)
                with open(AUDIO_TARGET, "w") as f:
                    f.write(audio_content)
                print("Successfully patched get_available_voices for LiteLLM routing.")
            else:
                print("audio.py voices call already patched or pattern changed.")
        except Exception as e:
            print(f"Failed to patch audio.py: {e}")

    # 5. Sync Audio Configuration into SQLite config table
    try:
        import sqlite3, json, time
        db_path = "/app/backend/data/webui.db"
        if os.path.exists(db_path):
            conn = sqlite3.connect(db_path)
            c = conn.cursor()
            now = int(time.time())
            tts_base_url = os.getenv('AUDIO_TTS_OPENAI_API_BASE_URL', 'http://llm-router-service.llm:4000/v1')
            tts_key = os.getenv('AUDIO_TTS_OPENAI_API_KEY', os.getenv('OPENAI_API_KEYS', ''))
            stt_base_url = os.getenv('AUDIO_STT_OPENAI_API_BASE_URL', 'http://llm-router-service.llm:4000/v1')
            stt_key = os.getenv('AUDIO_STT_OPENAI_API_KEY', os.getenv('OPENAI_API_KEYS', ''))

            audio_settings = {
                'audio.tts.engine': json.dumps('openai'),
                'audio.tts.model': json.dumps('kokoro'),
                'audio.tts.voice': json.dumps('af_bella'),
                'audio.tts.openai.api_base_url': json.dumps(tts_base_url),
                'audio.tts.openai.api_key': json.dumps(tts_key),
                'audio.stt.engine': json.dumps('openai'),
                'audio.stt.model': json.dumps('whisper-1'),
                'audio.stt.openai.api_base_url': json.dumps(stt_base_url),
                'audio.stt.openai.api_key': json.dumps(stt_key)
            }
            for k, v in audio_settings.items():
                c.execute('INSERT INTO config (key, value, updated_at) VALUES (?, ?, ?) ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at', (k, v, now))
            conn.commit()
            conn.close()
            print("Successfully synced audio configuration into SQLite webui.db.")
    except Exception as e:
        print(f"Failed to sync audio configuration into SQLite: {e}")


