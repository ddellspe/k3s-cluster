apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-flux2
  namespace: llm
  labels:
    app: llm-flux2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-flux2
  template:
    metadata:
      labels:
        app: llm-flux2
    spec:
      nodeSelector:
        gpu.family: strix-halo
      containers:
      - name: vllm-flux2
        image: docker.io/vllm/vllm-omni-rocm:v0.28.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          echo "Starting FLUX.2 Klein 9B on vLLM-Omni ROCm..."
          sed -i 's/50 if req.sampling_params.num_inference_steps is None/4 if req.sampling_params.num_inference_steps is None/g' /usr/local/lib/python3.12/dist-packages/vllm_omni/diffusion/models/flux2_klein/pipeline_flux2_klein.py || true
          exec python3 -m vllm_omni.entrypoints.cli.main serve black-forest-labs/FLUX.2-klein-9B \
            --omni \
            --host 0.0.0.0 \
            --port 8000 \
            --enforce-eager
        env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.5.1"
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: VLLM_TARGET_DEVICE
          value: "rocm"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        ports:
        - containerPort: 8000
          name: http
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /dev/kfd
          name: dev-kfd
        - mountPath: /dev/dri
          name: dev-dri
        - mountPath: /root/.cache/huggingface
          name: hf-cache
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
          limits:
            cpu: "16"
            memory: "48Gi"
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: dev-kfd
        hostPath:
          path: /dev/kfd
      - name: dev-dri
        hostPath:
          path: /dev/dri
      - name: hf-cache
        hostPath:
          path: /var/lib/rancher/k3s/storage/hf-cache
          type: DirectoryOrCreate
