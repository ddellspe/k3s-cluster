apiVersion: apps/v1
kind: Deployment
metadata:
  name: buyoutyourcoach
  namespace: buyoutyourcoach
  labels:
    app: buyoutyourcoach
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buyoutyourcoach
  template:
    metadata:
      labels:
        app: buyoutyourcoach
    spec:
      nodeSelector:
        kubernetes.io/hostname: well
      securityContext:
        fsGroup: 65533
      containers:
      - name: buyoutyourcoach
        image: registry.ddellspe.dev/buyoutyourcoach:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: NODE_ENV
          value: "production"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          value: "postgres-service.buyoutyourcoach.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service.buyoutyourcoach.svc.cluster.local:5432/buyoutyourcoach"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: app-data
          mountPath: /app/data
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: buyoutyourcoach-data-pvc
